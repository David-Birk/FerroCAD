[package]
name = "ferrocad"
description = "Native parametric CAD for Linux – sketch, constrain, extrude, fillet"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ferrocad-sketch.workspace = true
ferrocad-model.workspace = true
ferrocad-view.workspace = true
ferrocad-kernel-occt.workspace = true
eframe.workspace = true
egui.workspace = true
# Native file dialogs through the XDG desktop portal (KDE, GNOME, …).
rfd = "0.17"
bytemuck = "1"
# Sketch text: glyph outlines (pure Rust) of the font egui already bundles.
ttf-parser = { version = "0.25", default-features = false, features = ["std"] }
epaint_default_fonts = "0.36"

[dev-dependencies]
# Headless UI tests that click through whole workflows.
egui_kittest = { version = "0.36", features = ["eframe", "wgpu", "snapshot"] }

[features]
builtin-occt = ["ferrocad-kernel-occt/builtin"]
